  - title: Simulations
    layout: list
    content:
      - layout: left
        title: Analysis of the virus spreading COVID-19 with a renewal process
        link: https://hiro06190-repo-untitled6-xdak8i.streamlit.app/
        description: |
             I also have studied the initial growth of the epidemic curve of Covid-19 by using a stochastic model. This stochastic model is based on a heavy-tailed renewal process. The COVID-19 data is from Johns Hopkins University data site.
      - layout: left
        title: Autoencoder by random forest
        link: https://github.com/Hiro06190/codesummary
        description: |
            I applied a simulation of autoencoder by random forest to detect anomalous events. This simulation is based on theoretically [[link]](https://arxiv.org/abs/1709.09018), and technically [[link]](https://github.com/AntoinePassemiers/Encoder-Forest). My code is edited based on the original code to be used easily for a lot of data. I reconstructed experimental data for anomaly detection. Also, roughly speaking, the eforest works fast even on a low-spec computer. The prototype code is for MNIST data. Moreover, we can switch Unsupervised learning to Supervised learning on the code.

