  - title: Research interests
    layout: text
    content: | # this will include new lines to allow paragraphs
      I am interested in mathematical physics (or applied mathematics) topics. In particular, I am working on statistical mechanics and probability theory. More specific topics in which I am interested are the following :
      
        - Non-equilibrium statistical physics, Analysis of physical and biological systems such as active matter and spin models.

        - Heavy-tailed renewal processes and anomalous fluctuations; finite-time large deviation theory for heavy-tailed stochastic processes.

        - Mathematical derivation of macroscopic equations from microscopic models; stochastic hydrodynamics, large deviation principles, and gradient flows.

        - Propagation of chaos.

        - Dynamical systems, stability analysis, and numerical simulation.

        - Universal properties of machine learning methods, including neural network models.

